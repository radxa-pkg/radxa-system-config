[Service]
# IRMC and PBAP can dispatch the org.bluez service watch before obexd has
# initialized its server profiles. Skip these unused server plugins so OPP
# and FTP are registered reliably.
ExecStart=
ExecStart=/usr/libexec/bluetooth/obexd --noplugin=irmc,pbap

# BlueZ resets this non-persistent setting on every boot. Keep the controller
# connectable so paired phones can initiate an incoming OPP transfer.
ExecStartPost=/usr/bin/busctl --system set-property org.bluez /org/bluez/hci0 org.bluez.Adapter1 Connectable b true
